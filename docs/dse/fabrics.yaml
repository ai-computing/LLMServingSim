# 04 — DSE 상호연결망(fabric) 프리셋
#
# fabric = 하나의 "물리 박스"의 인터커넥트 토폴로지.
# DSE는 후보의 TP 차수에 맞춰 이 티어들을 ASTRA-Sim의 hierarchical
# tp_group_shape 로 자동 분해한다 (config_builder.py: _create_network_config).
#
# 구성 원칙:
#   - tiers: 가장 안쪽(빠른) 계층부터 바깥(느린) 순서로 나열한다.
#       size       : 이 계층이 묶는 NPU 수 (예: NVLink 쌍 = 2)
#       bw_gbs     : 단방향 대역폭 (GB/s) — cluster_config link_bw 와 동일 단위
#       latency_ns : 링크 지연 (ns). 보통 0
#   - 모든 size 의 곱 = 박스 1대의 총 NPU 수.
#   - TP=k 후보는 안쪽 티어부터 곱이 k 가 될 때까지 소비한다.
#       예) tiers=[2,2,2] →  TP2: [2] / TP4: [2,2] / TP8: [2,2,2]
#   - TP 차수가 티어로 깔끔히 분해되지 않으면(예: TP3) 가장 느린 티어
#     대역폭을 스칼라로 사용하는 보수적 fallback 으로 내려간다.
#
# fabric 을 지정하지 않으면 DSE 는 03_catalog.yaml 의 hw 별
# interconnect_bw_gbs (이종 구성은 최소값) 를 평면 스칼라로 사용한다.

fabrics:

  # 8×A40 2-socket 워크스테이션, 노드당 8 GPU, 200G InfiniBand 로 최대 2 노드(16 GPU)까지.
  #   - TP<=8 : 한 박스 안 (nvlink/pcie/qpi) — cluster_config/a40_8gpu_tp8_70b_3tier.json 과 동일.
  #   - TP16  : 4번째 ib 티어를 소비해 노드 경계를 넘는다 → tp_group_shape=[2,2,2,2],
  #             link_bw=[52.8,24.5,21.0,25.0]. 검증된 cluster_config/a40_16gpu_tp16_70b_4tier*.json
  #             와 동일한 토폴로지. (size 곱 = 16 = 2 노드 × 8 GPU)
  a40_8gpu_2socket:
    description: "8×A40/node, 2-socket: NVLink / intra-NUMA PCIe / cross-socket QPI / cross-node 200G IB"
    tiers:
      - {name: nvlink, size: 2, bw_gbs: 52.8, latency_ns: 0}
      - {name: pcie,   size: 2, bw_gbs: 24.5, latency_ns: 0}
      - {name: qpi,    size: 2, bw_gbs: 21.0, latency_ns: 0}
      # 노드 경계: 200 Gbps InfiniBand = 25.0 GB/s 단방향. TP>8 인 후보만 이 티어를 소비한다.
      # 실제 NCCL IB all-reduce + vLLM TP16 으로 검증 (validation/MULTINODE_TP16_REPORT_KO.md).
      - {name: ib,     size: 2, bw_gbs: 25.0, latency_ns: 0}
    # Load-dependent TP all-reduce overhead the bandwidth-only collective misses.
    # Two tiers, each gated independently in trace_generator.py:_collective_overhead_ns:
    #   - socket_size=4 : TP group crosses the cross-socket QPI boundary (TP8). TP<=4 untouched.
    #     Calibrated vs real vLLM on A40 (validation/VALIDATION_A40_REPORT.md):
    #     closes TP8 70B gap 619.8->305.3 (vLLM 305.8) and 8B +106%->-7.5%.
    #   - node_size=8 : TP group crosses the cross-node IB boundary (TP16). TP<=8 untouched.
    #     Calibrated vs real NCCL IB all-reduce + vLLM (validation/MULTINODE_TP16_REPORT_KO.md);
    #     matches cluster_config/a40_16gpu_tp16_70b_4tier_cohd.json.
    collective_overhead: {enabled: true, socket_size: 4, floor_ns: 70000, per_token_ns: 10000, node_size: 8, node_floor_ns: 105000, node_per_token_ns: 18000}

  # 8-GPU NVLink full mesh (예: A100/H100 SXM DGX 노드의 단일 NVLink 도메인).
  nvlink_8gpu:
    description: "8-GPU single NVLink domain (DGX-class SXM node)"
    tiers:
      - {name: nvlink, size: 8, bw_gbs: 600.0, latency_ns: 0}

  # PCIe 전용 4-GPU 박스 (NVLink 없는 consumer/workstation).
  pcie_4gpu:
    description: "4-GPU PCIe-only box (no NVLink)"
    tiers:
      - {name: pcie, size: 4, bw_gbs: 32.0, latency_ns: 0}
